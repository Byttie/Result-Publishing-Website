# SonarQube Cloud settings, used by the "sonar" job in .github/workflows/ci.yaml.
# Check these two against your project on sonarcloud.io (Project → Information).
sonar.organization=byttie
sonar.projectKey=Byttie_Result-Publishing-Website

# What to scan
sonar.sources=backend,frontend/src
sonar.exclusions=**/migrations/**,**/node_modules/**,**/dist/**,**/staticfiles/**
sonar.python.version=3.12

# Make the CI job fail when the Quality Gate fails
sonar.qualitygate.wait=true
