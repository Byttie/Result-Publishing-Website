name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      
      - run: python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The real .env files are not in git; empty ones are enough to build.
      - run: touch k8s/backend.env k8s/postgres.env
      - run: kubectl kustomize k8s > /dev/null

  # Code quality scan on SonarQube Cloud (settings in sonar-project.properties).
  # Fails if the Quality Gate fails, which blocks the docker job.
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Sonar can tell new code from old
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Runs only after all tests pass.
  # Pull requests: build the images to check the Dockerfiles (nothing is pushed).
  # Push to main:  build and push rag1b/rpw-*:<short sha> to Docker Hub; CD deploys that tag.
  docker:
    needs: [backend, frontend, manifests, sonar]
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: rag1b/rpw-backend
      FRONTEND_IMAGE: rag1b/rpw-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (short commit SHA)
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build images
        run: |
          docker build -t $BACKEND_IMAGE:$TAG ./backend
          docker build -t $FRONTEND_IMAGE:$TAG ./frontend

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images
        if: github.event_name == 'push'
        run: |
          docker push $BACKEND_IMAGE:$TAG
          docker push $FRONTEND_IMAGE:$TAG