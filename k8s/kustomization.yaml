apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - Database.yaml
  - Redis.yaml
  - Backend.yaml
  - django-configmap.yaml
  - Frontend.yaml
  - Ingress.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: backend-secret
    namespace: app
    envs:
      - backend.env
  - name: postgres-secret
    namespace: db-production
    envs:
      - postgres.env

# The manifests use the placeholder names "backend" and "frontend";
# kustomize replaces them with these Docker Hub images. Bump newTag for each release.
images:
  - name: backend
    newName: rag1b/rpw-backend
    newTag: "1.0"
  - name: frontend
    newName: rag1b/rpw-frontend
    newTag: "1.0"
