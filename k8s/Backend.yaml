apiVersion: v1
kind: Namespace
metadata:
  name: app

---
# Job for Migration

apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  namespace: app
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600 
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: backend  # real image and tag are set in kustomization.yaml
        imagePullPolicy: IfNotPresent
        args: ["echo", "Migrations done."]  
        env:
        - name: RUN_MIGRATIONS
          value: "true"
        envFrom:
        - configMapRef:
            name: django-configmap
        - secretRef:
            name: backend-secret

---
# Deployment for Backend

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: backend  # real image and tag are set in kustomization.yaml
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: RUN_MIGRATIONS
          value: "false"        
        envFrom:
        - configMapRef:
            name: django-configmap
        - secretRef:
            name: backend-secret

        resources:
          requests:
            cpu: 50m
            memory: 180Mi
          limits:
            memory: 300Mi

        readinessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20

---
# Cluster IP service

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: app
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
